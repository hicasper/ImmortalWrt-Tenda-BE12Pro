name: Build Tenda BE12 Pro

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      WRT_PKG:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string

env:
  WRT_PKG: ${{inputs.WRT_PKG}}


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      DEBIAN_FRONTEND: noninteractive
      FIRMWARE_CONFIG: defconfig/minimal.config
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "3000M"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Cache
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: true
          mixkey: 'a53-mtkdev'

      - name: Initialize Build Environment
        run: |
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo curl -sL -o /tmp/init_build_environment.sh https://build-scripts.immortalwrt.org/init_build_environment.sh
          sudo sed -i '/full-upgrade/d' /tmp/init_build_environment.sh
          sudo bash /tmp/init_build_environment.sh
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

          mkdir -p "${CCACHE_DIR}" dl
          ccache -M "${CCACHE_MAXSIZE}"
          ccache --zero-stats || true
          ccache --show-config | sed -n '1,20p'

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          bash ./custom.sh

      - name: Load Tenda BE12 Pro Configuration
        run: |
          set -euo pipefail

          set_config() {
            local key="$1"
            local value="$2"

            if grep -q "^# ${key} is not set$" .config; then
              sed -i "s|^# ${key} is not set$|${key}=${value}|" .config
            elif grep -q "^${key}=" .config; then
              sed -i "s|^${key}=.*$|${key}=${value}|" .config
            else
              echo "${key}=${value}" >> .config
            fi
          }

          test -f "${FIRMWARE_CONFIG}"
          cp -f "${FIRMWARE_CONFIG}" .config
          set_config "CONFIG_TARGET_mediatek_filogic_DEVICE_tenda_be12-pro" "y"
          set_config "CONFIG_CCACHE" "y"
          set_config "CONFIG_TARGET_ROOTFS_INITRAMFS" "n"
          make defconfig

          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_tenda_be12-pro=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y' .config
          grep -E '^(CONFIG_TARGET_|CONFIG_CCACHE=|CONFIG_PACKAGE_kmod-mt7992=|CONFIG_MTK_WIFI7_CHIP_MT7992=)' .config

      - name: Download Sources
        run: |
          ccache --show-stats || true
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete
          # Update Golang
          ln -sfn "/usr/bin/go" "./staging_dir/hostpkg/bin/go"
          ln -sfn "/usr/bin/gofmt" "./staging_dir/hostpkg/bin/gofmt"
          ln -sfn "/usr/bin/go" "./staging_dir/host/bin/go"
          ln -sfn "/usr/bin/gofmt" "./staging_dir/host/bin/gofmt"
          ln -sfn "/usr/bin/go" "./staging_dir/hostpkg/lib/go-cross/bin/go"

      - name: Compile Firmware
        run: |
          set -euo pipefail
          ccache --show-stats || true
          if ! make -j"$(nproc)"; then
            ln -sfn "/usr/bin/go" "./staging_dir/hostpkg/bin/go"
            ln -sfn "/usr/bin/gofmt" "./staging_dir/hostpkg/bin/gofmt"
            ln -sfn "/usr/bin/go" "./staging_dir/host/bin/go"
            ln -sfn "/usr/bin/gofmt" "./staging_dir/host/bin/gofmt"
            ln -sfn "/usr/bin/go" "./staging_dir/hostpkg/lib/go-cross/bin/go"
            if ! make -j"$(nproc)"; then
              echo "::warning::Parallel build failed, retrying with -j1 V=s"
              make -j1 V=s
            fi
          fi
          ccache --show-stats || true

      - name: Verify Wireless UI Package
        run: |
          grep -Eq '^luci-app-mtwifi-cfg[[:space:]]' \
            bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-tenda_be12-pro.manifest

      - name: Collect Build Configuration
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cp .config artifacts/immortalwrt-tenda-be12-pro.config
          test -s artifacts/immortalwrt-tenda-be12-pro.config
          cp -p bin/targets/mediatek/filogic/*.bin artifacts/
          #cp -p bin/targets/mediatek/filogic/mt7987*.bin artifacts/

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-tenda-be12-pro
          path: |
            ./artifacts
          if-no-files-found: error

      - name: Setup upterm debug session
        uses: owenthereal/action-upterm@v2
        if: ${{ failure() }}
        with:
          wait-timeout-minutes: 15

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

    steps:
      - name: Download Firmware
        uses: actions/download-artifact@v8
        with:
          path: all-firmwares

      - name: Prepare Release Files
        run: |
          set -euo pipefail

          mkdir -p final-release
          find all-firmwares -type f -name '*.bin' -print -exec cp {} final-release/ \;
          find all-firmwares -type f -name '*.config' -print -exec cp {} final-release/ \;

          if ! find final-release -type f -name '*.bin' -print -quit | grep -q .; then
            echo "No Tenda BE12 Pro firmware files found" >&2
            find all-firmwares -maxdepth 3 -type f -print >&2
            exit 1
          fi

          ls -lh final-release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          tag_name: ${{ github.ref_name }}
          files: |
            final-release/*.bin
            final-release/*.config
          fail_on_unmatched_files: true
          draft: false
          body: |
            ## Tenda BE12 Pro ImmortalWrt

            - Source base: `kalicyh/ImmortalWrt-tenda_be12-pro`
            - Device: Tenda BE12 Pro
            - Build config: `defconfig/minimal.config`
            - Full build config: `immortalwrt-tenda-be12-pro.config`
            - Commit: `${{ github.sha }}`
