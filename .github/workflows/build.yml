name: Build Tenda BE12 Pro

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "3000M"
      CCACHE_BASEDIR: ${{ github.workspace }}
      FIRMWARE_CONFIG: defconfig/low-mem-512m/mt7987-mt7992-be7200.config

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Download Cache
        uses: actions/cache@v6
        with:
          path: dl
          key: ${{ runner.os }}-immortalwrt-dl-tenda-be12-pro-${{ hashFiles('defconfig/low-mem-512m/mt7987-mt7992-be7200.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-tenda-be12-pro-
            ${{ runner.os }}-immortalwrt-dl-

      - name: Restore Compiler Cache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-ccache-tenda-be12-pro-${{ hashFiles('defconfig/low-mem-512m/mt7987-mt7992-be7200.config') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-tenda-be12-pro-${{ hashFiles('defconfig/low-mem-512m/mt7987-mt7992-be7200.config') }}-
            ${{ runner.os }}-immortalwrt-ccache-tenda-be12-pro-
            ${{ runner.os }}-immortalwrt-ccache-

      - name: Restore Host/Toolchain Cache
        id: host-toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ runner.os }}-immortalwrt-host-toolchain-tenda-be12-pro-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-host-toolchain-tenda-be12-pro-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-
            ${{ runner.os }}-immortalwrt-host-toolchain-tenda-be12-pro-
            ${{ runner.os }}-immortalwrt-host-toolchain-

      - name: Initialize Build Environment
        run: |
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo curl -sL -o /tmp/init_build_environment.sh https://build-scripts.immortalwrt.org/init_build_environment.sh
          sudo sed -i '/full-upgrade/d' /tmp/init_build_environment.sh
          sudo bash /tmp/init_build_environment.sh

      - name: Prepare Compiler Cache
        run: |
          set -euo pipefail

          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

          mkdir -p "${CCACHE_DIR}" dl
          ccache -M "${CCACHE_MAXSIZE}"
          ccache --zero-stats || true
          ccache --show-config | sed -n '1,20p'

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          bash ./custom.sh

      - name: Load Tenda BE12 Pro Configuration
        run: |
          set -euo pipefail

          set_config() {
            local key="$1"
            local value="$2"

            if grep -q "^# ${key} is not set$" .config; then
              sed -i "s|^# ${key} is not set$|${key}=${value}|" .config
            elif grep -q "^${key}=" .config; then
              sed -i "s|^${key}=.*$|${key}=${value}|" .config
            else
              echo "${key}=${value}" >> .config
            fi
          }

          test -f "${FIRMWARE_CONFIG}"
          cp -f "${FIRMWARE_CONFIG}" .config
          sed -i \
            's/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_routerich_be7200=y$/# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_routerich_be7200 is not set/' \
            .config
          set_config "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tenda_be12-pro" "y"
          set_config "CONFIG_CCACHE" "y"
          set_config "CONFIG_TARGET_ROOTFS_INITRAMFS" "n"
          make defconfig

          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tenda_be12-pro=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y' .config
          grep -E '^(CONFIG_TARGET_|CONFIG_CCACHE=|CONFIG_PACKAGE_kmod-mt7992=|CONFIG_MTK_WIFI7_CHIP_MT7992=)' .config

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        if: ${{ failure() }}
        with:
          wait-timeout-minutes: 15

      - name: Download Sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete

      - name: Compile Firmware
        run: |
          set -euo pipefail

          ccache --show-stats || true

          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed, retrying with -j1 V=s"
            make -j1 V=s
          fi

          ccache --show-stats || true

      - name: Verify Wireless UI Package
        run: |
          grep -Eq '^luci-app-mtwifi-cfg[[:space:]]' \
            bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic.manifest

      - name: Collect Build Configuration
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cp .config artifacts/immortalwrt-tenda-be12-pro.config
          test -s artifacts/immortalwrt-tenda-be12-pro.config
          cp -p bin/targets/mediatek/filogic/immortalwrt*.bin artifacts/
          cp -p bin/targets/mediatek/filogic/mt7987*.bin artifacts/

      - name: Save Compiler Cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save Host/Toolchain Cache
        if: success() && steps.host-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ steps.host-toolchain-cache.outputs.cache-primary-key }}

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-tenda-be12-pro
          path: |
            ./artifacts
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

    steps:
      - name: Download Firmware
        uses: actions/download-artifact@v8
        with:
          path: all-firmwares

      - name: Prepare Release Files
        run: |
          set -euo pipefail

          mkdir -p final-release
          find all-firmwares -type f -name '*.bin' -print -exec cp {} final-release/ \;
          find all-firmwares -type f -name '*.config' -print -exec cp {} final-release/ \;

          if ! find final-release -type f -name '*.bin' -print -quit | grep -q .; then
            echo "No Tenda BE12 Pro firmware files found" >&2
            find all-firmwares -maxdepth 3 -type f -print >&2
            exit 1
          fi

          ls -lh final-release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          tag_name: ${{ github.ref_name }}
          files: |
            final-release/*.bin
            final-release/*.config
          fail_on_unmatched_files: true
          draft: false
          body: |
            ## Tenda BE12 Pro ImmortalWrt

            - Source base: `chasey-dev/immortalwrt-mt798x-rebase:25.12-dev-wifi7`
            - Device: Tenda BE12 Pro
            - Wireless: MediaTek MT7992 with the MTK Wi-Fi 7 driver
            - Build config: `defconfig/low-mem-512m/mt7987-mt7992-be7200.config`
            - Full build config: `immortalwrt-tenda-be12-pro.config`
            - Commit: `${{ github.sha }}`
